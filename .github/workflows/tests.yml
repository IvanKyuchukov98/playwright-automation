name: Tests

on:
  schedule:
    - cron: '37 3 * * *' # nightly full regression; an off-peak minute starts closer to on time
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [regression, smoke]
        default: regression
      browsers:
        description: Browsers
        type: choice
        options: [all, chromium, firefox, webkit]
        default: all

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  plan:
    name: Plan run
    runs-on: ubuntu-24.04
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_BROWSERS: ${{ inputs.browsers }}
        run: |
          # Nightly runs cover every browser; manual runs use the chosen inputs.
          case "$EVENT" in
            schedule) suite=regression; browsers=all ;;
            *)        suite="$INPUT_SUITE"; browsers="$INPUT_BROWSERS" ;;
          esac
          if [ "$browsers" = all ]; then browsers="chromium firefox webkit"; fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
          echo "Running **$suite** on $browsers, plus the API tests" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Playwright splits the selected tests evenly across shards. Add numbers to scale out.
        shard: [1, 2]
    env:
      SUITE: ${{ needs.plan.outputs.suite }}
      BROWSERS: ${{ needs.plan.outputs.browsers }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps $BROWSERS

      # The public site blocks CI browsers with a Cloudflare check, so test a local copy instead.
      - name: Start the Toolshop
        id: toolshop
        uses: IvanKyuchukov98/toolshop-environment@v1

      - name: Run tests
        env:
          UI_BASE_URL: ${{ steps.toolshop.outputs.ui-url }}
          API_BASE_URL: ${{ steps.toolshop.outputs.api-url }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          args=(--project=api --shard="$SHARD")
          for browser in $BROWSERS; do args+=(--project="$browser"); done
          if [ "$SUITE" = smoke ]; then args+=(--grep=@smoke); fi
          npx playwright test "${args[@]}"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 1 # only needed until the merge job has run

  report:
    name: Merge reports
    needs: [plan, test]
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUITE: ${{ needs.plan.outputs.suite }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports

      - name: Merge into one HTML report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: npx playwright merge-reports --reporter html,json all-blob-reports

      # run.json travels inside the report: the summary and the report history page read it.
      - name: Test summary
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          node .github/scripts/run-info.mjs results.json playwright-report/run.json
          node .github/scripts/summary.mjs playwright-report/run.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30 # the report history page republishes the last 10 runs from these

  publish-report:
    name: Publish report
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # download report artifacts of earlier runs
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download this run's report
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site/runs/${{ github.run_number }}

      - name: Download earlier runs' reports
        run: bash .github/scripts/fetch-previous-reports.sh site/runs 10

      - name: Build the report history page
        run: node .github/scripts/build-report-index.mjs site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Link the report in the run summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          {
            echo "### Test report"
            echo "- [Playwright report for this run](${PAGE_URL}runs/$RUN_NUMBER/)"
            echo "- [Report history (last 10 runs)](${PAGE_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
